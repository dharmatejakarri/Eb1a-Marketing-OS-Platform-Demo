<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EB1A Experts — Marketing OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;450;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
/* EB1A Marketing Funnel — Design Tokens
   Brand colors lifted from eb1aexperts.com: deep violet + teal, grounded on near-black.
   Linear/Vercel-inspired density, electric accent energy. */

:root {
  /* Foundation */
  --bg-0: #09090c;
  --bg-1: #0d0d12;
  --bg-2: #121219;
  --bg-3: #1a1a22;
  --bg-4: #23232e;
  --bg-5: #2d2d3a;

  /* Lines */
  --line-1: rgba(255,255,255,0.06);
  --line-2: rgba(255,255,255,0.09);
  --line-3: rgba(255,255,255,0.14);
  --line-4: rgba(255,255,255,0.22);

  /* Text */
  --text-0: #f4f4f7;
  --text-1: #d4d4dc;
  --text-2: #9898a6;
  --text-3: #6a6a78;
  --text-4: #4a4a56;

  /* Brand - EB1A violet + teal, amped for dark */
  --violet: #7c5cff;
  --violet-1: #9b82ff;
  --violet-2: #5a3dd6;
  --violet-bg: rgba(124,92,255,0.12);
  --violet-ring: rgba(124,92,255,0.35);

  --teal: #2dd4bf;
  --teal-1: #5eead4;
  --teal-2: #14b8a6;
  --teal-bg: rgba(45,212,191,0.10);

  --lime: #c4f542;
  --cyan: #22d3ee;
  --magenta: #e879f9;
  --amber: #fbbf24;

  /* Accent — overridden by tweaks */
  --accent: var(--violet);
  --accent-1: var(--violet-1);
  --accent-bg: var(--violet-bg);
  --accent-ring: var(--violet-ring);

  /* Semantic */
  --ok: #4ade80;
  --warn: #fbbf24;
  --err: #f87171;
  --info: #60a5fa;

  /* Platform brand chips */
  --p-linkedin: #0a66c2;
  --p-instagram: #e1306c;
  --p-facebook: #1877f2;
  --p-x: #e7e7ea;
  --p-youtube: #ff0033;
  --p-medium: #c4f542;

  /* Type */
  --font-sans: 'Inter Tight', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --font-display: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;

  /* Density */
  --pad-1: 4px;
  --pad-2: 8px;
  --pad-3: 12px;
  --pad-4: 16px;
  --pad-5: 20px;
  --pad-6: 24px;
  --pad-8: 32px;

  --row-h: 32px;
  --radius-1: 4px;
  --radius-2: 6px;
  --radius-3: 8px;
  --radius-4: 10px;
  --radius-5: 14px;

  --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-2: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-3: 0 12px 48px rgba(0,0,0,0.6);
  --shadow-accent: 0 0 0 1px var(--accent-ring), 0 8px 32px rgba(124,92,255,0.25);
}

/* Light theme override */
:root[data-theme="light"] {
  --bg-0: #fafaf9;
  --bg-1: #ffffff;
  --bg-2: #f4f4f2;
  --bg-3: #ececea;
  --bg-4: #e0e0dd;
  --bg-5: #d4d4d0;

  --line-1: rgba(0,0,0,0.05);
  --line-2: rgba(0,0,0,0.08);
  --line-3: rgba(0,0,0,0.12);
  --line-4: rgba(0,0,0,0.2);

  --text-0: #0a0a0f;
  --text-1: #2a2a33;
  --text-2: #5a5a66;
  --text-3: #8a8a94;
  --text-4: #b0b0b8;
}

/* Density */
:root[data-density="compact"] {
  --pad-3: 8px;
  --pad-4: 12px;
  --pad-5: 14px;
  --pad-6: 16px;
  --row-h: 28px;
}
:root[data-density="comfy"] {
  --pad-3: 16px;
  --pad-4: 20px;
  --pad-5: 24px;
  --pad-6: 32px;
  --row-h: 40px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-0);
  color: var(--text-1);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.005em;
}

body { overflow: hidden; height: 100vh; }
#root { height: 100vh; width: 100vw; }

button { font-family: inherit; color: inherit; cursor: default; }
input, textarea, select { font-family: inherit; color: inherit; }

::selection { background: var(--accent); color: white; }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border-radius: 10px;
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--line-4);
  background-clip: content-box;
  border: 2px solid transparent;
}

/* ─── App shell ─── */
.app {
  display: grid;
  grid-template-columns: 200px 1fr 300px;
  grid-template-rows: 44px 1fr;
  height: 100vh;
  background: var(--bg-0);
}
.app[data-feed="off"] { grid-template-columns: 200px 1fr; }
.app[data-nav="collapsed"] { grid-template-columns: 52px 1fr 300px; }
.app[data-nav="collapsed"][data-feed="off"] { grid-template-columns: 52px 1fr; }

.topbar {
  grid-column: 1 / -1;
  grid-row: 1;
  border-bottom: 1px solid var(--line-1);
  background: var(--bg-0);
  display: flex;
  align-items: center;
  padding: 0 var(--pad-4);
  gap: var(--pad-4);
  z-index: 10;
}
.sidenav {
  grid-row: 2;
  border-right: 1px solid var(--line-1);
  background: var(--bg-0);
  padding: var(--pad-3);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.main {
  grid-row: 2;
  overflow-y: auto;
  background: var(--bg-0);
  min-width: 0;
}
.feed {
  grid-row: 2;
  border-left: 1px solid var(--line-1);
  background: var(--bg-1);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* ─── Nav items ─── */
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--pad-3);
  padding: 6px 10px;
  border-radius: var(--radius-2);
  color: var(--text-2);
  font-size: 13px;
  font-weight: 450;
  cursor: default;
  user-select: none;
  white-space: nowrap;
  min-height: 28px;
}
.nav-item:hover { background: var(--bg-2); color: var(--text-1); }
.nav-item.active {
  background: var(--bg-3);
  color: var(--text-0);
}
.nav-item .icon { width: 16px; height: 16px; flex: 0 0 16px; opacity: 0.85; }
.nav-item .kbd { margin-left: auto; color: var(--text-4); font-size: 11px; font-family: var(--font-mono); }
.nav-item .badge {
  margin-left: auto;
  background: var(--accent);
  color: white;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 10px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.nav-group {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-4);
  padding: 14px 10px 4px;
}
.nav-group:first-child { padding-top: 4px; }

/* ─── Topbar ─── */
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 13px;
  color: var(--text-0);
  letter-spacing: -0.01em;
}
.logo-mark {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--teal) 100%);
  position: relative;
  flex: 0 0 22px;
}
.logo-mark::after {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 3px;
  background: var(--bg-0);
}
.logo-mark::before {
  content: '';
  position: absolute;
  inset: 7px;
  border-radius: 1px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--teal) 100%);
}

.topbar-search {
  flex: 1;
  max-width: 520px;
  margin: 0 auto;
  position: relative;
}
.topbar-search input {
  width: 100%;
  height: 28px;
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: var(--radius-2);
  padding: 0 32px 0 30px;
  color: var(--text-1);
  font-size: 12px;
  outline: none;
}
.topbar-search input:focus { border-color: var(--line-3); background: var(--bg-3); }
.topbar-search .s-icon {
  position: absolute; left: 9px; top: 6px; color: var(--text-3);
}
.topbar-search .s-kbd {
  position: absolute; right: 8px; top: 5px;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3);
  background: var(--bg-3); padding: 1px 5px; border-radius: 3px;
  border: 1px solid var(--line-2);
}

/* ─── Buttons ─── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius-2);
  background: var(--bg-2);
  color: var(--text-1);
  font-size: 12px;
  font-weight: 500;
  cursor: default;
  transition: background 120ms, border-color 120ms;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-3); border-color: var(--line-3); }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.btn.primary:hover { background: var(--accent-1); border-color: var(--accent-1); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--bg-2); color: var(--text-1); }
.btn.danger { color: var(--err); }
.btn.danger:hover { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.3); }
.btn.ok { color: var(--ok); }
.btn.ok:hover { background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.3); }
.btn.sm { height: 22px; padding: 0 7px; font-size: 11px; }
.btn.lg { height: 34px; padding: 0 14px; font-size: 13px; }
.btn.icon-only { width: 28px; padding: 0; justify-content: center; }
.btn.icon-only.sm { width: 22px; }

/* ─── Cards / panels ─── */
.card {
  background: var(--bg-1);
  border: 1px solid var(--line-1);
  border-radius: var(--radius-3);
}
.card-h {
  padding: var(--pad-4);
  border-bottom: 1px solid var(--line-1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--pad-3);
}
.card-h h3 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-0);
  letter-spacing: -0.005em;
}
.card-h .subtitle { color: var(--text-3); font-size: 12px; font-weight: 400; margin-left: 8px; }
.card-b { padding: var(--pad-4); }
.card-b.flush { padding: 0; }

/* ─── Badges ─── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 7px;
  font-size: 11px;
  font-weight: 500;
  border-radius: 4px;
  background: var(--bg-3);
  color: var(--text-1);
  border: 1px solid var(--line-1);
  white-space: nowrap;
}
.badge.accent { background: var(--accent-bg); color: var(--accent-1); border-color: var(--accent-ring); }
.badge.teal { background: var(--teal-bg); color: var(--teal-1); border-color: rgba(45,212,191,0.25); }
.badge.ok { background: rgba(74,222,128,0.1); color: var(--ok); border-color: rgba(74,222,128,0.25); }
.badge.warn { background: rgba(251,191,36,0.1); color: var(--warn); border-color: rgba(251,191,36,0.25); }
.badge.err { background: rgba(248,113,113,0.1); color: var(--err); border-color: rgba(248,113,113,0.25); }
.badge.dot::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.badge.live::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 3px rgba(74,222,128,0.2);
  animation: pulse 1.6s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(74,222,128,0.2); }
  50% { box-shadow: 0 0 0 5px rgba(74,222,128,0.05); }
}

/* ─── Page header ─── */
.page {
  padding: var(--pad-5) var(--pad-6);
  max-width: 1600px;
  margin: 0 auto;
}
.page-h { flex-wrap: wrap; }
.stat-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
@media (max-width: 1100px) {
  .grid-3 { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 820px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .page { padding: 14px 16px; }
}
.topbar-search { min-width: 0; }
.page-h {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--pad-4);
  padding-bottom: var(--pad-5);
  border-bottom: 1px solid var(--line-1);
  margin-bottom: var(--pad-5);
}
.page-h h1 {
  margin: 0 0 4px;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-0);
}
.page-h .eyebrow {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  margin-bottom: 4px;
}
.page-h p { margin: 0; color: var(--text-2); font-size: 13px; max-width: 600px; }

/* ─── Stats ─── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--pad-4);
  margin-bottom: var(--pad-5);
}
.stat {
  background: var(--bg-1);
  border: 1px solid var(--line-1);
  border-radius: var(--radius-3);
  padding: var(--pad-4);
  position: relative;
  overflow: hidden;
}
.stat .label {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.stat .value {
  font-size: 24px;
  font-weight: 600;
  color: var(--text-0);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.stat .delta {
  font-size: 11px;
  color: var(--ok);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.stat .delta.down { color: var(--err); }
.stat .spark {
  position: absolute;
  right: 0; bottom: 0;
  width: 80px;
  height: 34px;
  opacity: 0.8;
}

/* ─── Table ─── */
.tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.tbl th, .tbl td {
  padding: 9px 12px;
  text-align: left;
  border-bottom: 1px solid var(--line-1);
  white-space: nowrap;
}
.tbl th {
  font-weight: 500;
  color: var(--text-3);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--bg-1);
  position: sticky;
  top: 0;
  z-index: 1;
}
.tbl tbody tr:hover { background: var(--bg-2); }
.tbl tbody tr:last-child td { border-bottom: 0; }

/* ─── Activity feed ─── */
.feed-h {
  padding: var(--pad-4);
  border-bottom: 1px solid var(--line-1);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.feed-h h3 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-0);
  display: flex;
  align-items: center;
  gap: 8px;
}
.feed-body {
  padding: var(--pad-3) 0;
  flex: 1;
  overflow-y: auto;
}
.feed-item {
  padding: 8px var(--pad-4);
  display: flex;
  gap: 10px;
  position: relative;
  font-size: 12px;
  border-left: 2px solid transparent;
}
.feed-item:hover { background: var(--bg-2); border-left-color: var(--line-3); }
.feed-item .ts {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-4);
  flex: 0 0 42px;
  padding-top: 1px;
  font-variant-numeric: tabular-nums;
}
.feed-item .agent-ic {
  width: 16px; height: 16px; flex: 0 0 16px;
  margin-top: 1px;
  opacity: 0.9;
}
.feed-item .body { flex: 1; min-width: 0; }
.feed-item .body .who {
  font-weight: 500; color: var(--text-1);
}
.feed-item .body .action { color: var(--text-2); }
.feed-item .body .target {
  color: var(--accent-1);
  font-weight: 500;
}
.feed-item .body .tool {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--teal-1);
  background: var(--teal-bg);
  padding: 1px 5px;
  border-radius: 3px;
  border: 1px solid rgba(45,212,191,0.15);
  white-space: nowrap;
}
.feed-item .body .meta {
  color: var(--text-4); font-size: 11px; margin-top: 2px;
}
.feed-item.running .agent-ic { color: var(--accent-1); }
.feed-item.running .ts::after {
  content: ''; display: inline-block; width: 4px; height: 4px;
  border-radius: 50%; background: var(--accent);
  margin-left: 2px;
  animation: pulse 1.2s infinite;
}

/* ─── Generic ─── */
.row { display: flex; align-items: center; gap: var(--pad-3); }
.col { display: flex; flex-direction: column; gap: var(--pad-3); }
.spacer { flex: 1; }
.divider { height: 1px; background: var(--line-1); margin: var(--pad-3) 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.text-0 { color: var(--text-0); }
.text-1 { color: var(--text-1); }
.text-2 { color: var(--text-2); }
.text-3 { color: var(--text-3); }
.accent { color: var(--accent-1); }
.teal { color: var(--teal-1); }

/* Avatars */
.avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--teal) 100%);
  color: white;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  flex: 0 0 24px;
}
.avatar.sm { width: 18px; height: 18px; font-size: 9px; flex: 0 0 18px; }
.avatar.lg { width: 34px; height: 34px; font-size: 13px; flex: 0 0 34px; }

/* Platform chips */
.plat {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 5px;
  font-size: 11px; font-weight: 700; color: white;
  flex: 0 0 22px;
}
.plat.linkedin { background: var(--p-linkedin); }
.plat.instagram { background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
.plat.facebook { background: var(--p-facebook); }
.plat.x { background: #0a0a0a; color: white; border: 1px solid var(--line-3); }
.plat.youtube { background: var(--p-youtube); }
.plat.medium { background: #000; color: var(--lime); }
.plat.sm { width: 18px; height: 18px; font-size: 9px; border-radius: 4px; flex: 0 0 18px; }

/* Progress */
.progress {
  height: 4px;
  background: var(--bg-3);
  border-radius: 999px;
  overflow: hidden;
}
.progress > div {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--teal));
  border-radius: 999px;
  transition: width 300ms ease;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--line-1);
  padding: 0 var(--pad-4);
}
.tab {
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  cursor: default;
}
.tab:hover { color: var(--text-1); }
.tab.active {
  color: var(--text-0);
  border-bottom-color: var(--accent);
}

/* Segmented */
.segmented {
  display: inline-flex;
  background: var(--bg-2);
  border: 1px solid var(--line-1);
  border-radius: var(--radius-2);
  padding: 2px;
}
.segmented button {
  height: 22px;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

      { id: 'n4', ts: '2h ago', title: 'Morning brief delivered', body: 'Sent to owner@eb1aexperts.com', kind: 'system', unread: false },
      { id: 'n5', ts: 'Yesterday', title: 'Instagram post went live', body: '"5 signs you\'re ready for EB1A"', kind: 'publish', unread: false },
    ],
    settings: {
      requireApproval: true,
      skipApprovalX: false,
      autoReply: true,
      pauseOnDrop: true,
      sundayPosting: false,
      primaryColor: '#7c5cff',
      tealColor: '#2dd4bf',
      brandFont: 'Inter Tight',
    },
    trackedCompetitors: [], // populated
    selectedInfluencers: ['i3', 'i6'],
    searchQuery: '',
    activeFilters: { niche: ['tech', 'ai', 'phd'], platform: ['linkedin', 'instagram', 'x'], location: ['us'] },
  };

  function emit() { listeners.forEach(l => l()); }

  const Store = {
    get: () => state,
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    init() {
      if (window.POST_DRAFTS && !state.posts.length) {
        state.posts = window.POST_DRAFTS.map(p => ({ ...p }));
      }
      if (window.COMPETITORS && !state.trackedCompetitors.length) {
        state.trackedCompetitors = window.COMPETITORS.map(c => ({ ...c }));
      }
      emit();
    },

    // Toasts
    toast(title, body, kind = 'info', duration = 3400) {
      const tid = 't_' + (++id);
      state.toasts = [...state.toasts, { id: tid, title, body, kind }];
      emit();
      setTimeout(() => {
        state.toasts = state.toasts.filter(t => t.id !== tid);
        emit();
      }, duration);
    },

    // Modal
    openModal(modal) { state.modal = modal; emit(); },
    closeModal() { state.modal = null; emit(); },

    // Command palette
    toggleCommand(v) { state.commandOpen = v ?? !state.commandOpen; emit(); },

    // Posts
    approvePost(postId, schedule) {
      const p = state.posts.find(x => x.id === postId);
      if (!p) return;
      p.status = 'approved';
      p.scheduled = schedule || 'Tomorrow, 9:15 AM';
      emit();
      Store.toast('Post approved', `Scheduled for ${p.scheduled}`, 'ok');
    },
    rejectPost(postId, reason) {
      const p = state.posts.find(x => x.id === postId);
      if (!p) return;
      p.status = 'rejected';
      p.rejection = reason || 'Regenerating with feedback';
      emit();
      Store.toast('Post rejected', 'Agents are regenerating…', 'warn');
      // Simulate regen — move back to pending after delay
      setTimeout(() => {
        p.status = 'pending_review';
        p.rejection = null;
        p.score = Math.min(100, (p.score || 80) + 3);
        p.generated = 'just now';
        emit();
        Store.toast('Regenerated', `"${p.title.slice(0, 32)}…" is back in review`, 'info');
      }, 4000);
    },
    requestRevision(postId, note) {
      Store.toast('Revision requested', note || 'Rewriting with your note…', 'info');
      Store.rejectPost(postId, note);
    },
    schedulePost(postId, when) {
      const p = state.posts.find(x => x.id === postId);
      if (!p) return;
      p.scheduled = when;
      emit();
      Store.toast('Rescheduled', `Now posting ${when}`, 'ok');
    },
    createPost(data) {
      const newPost = {
        id: nextId(),
        platform: data.platform || 'linkedin',
        type: data.type || 'single',
        status: 'pending_review',
        generated: 'just now',
        title: data.title || 'Untitled draft',
        body: data.body || 'Generated copy will appear here.',
        hashtags: data.hashtags || ['#EB1A', '#GreenCard'],
        cta: data.cta || 'Book a free consult',
        trend: data.trend || null,
        score: Math.floor(Math.random() * 15) + 82,
        persona: data.persona || 'Senior tech IC',
        reach_est: (Math.random() * 15 + 5).toFixed(1) + 'K',
        engage_est: (Math.random() * 4 + 3).toFixed(1) + '%',
        scheduled: null,
        reviews: { editorial: 'pass', brand: 'pass', compliance: 'pass', design: 'pass', format: 'pass', engagement: 'pass' },
      };
      state.posts = [newPost, ...state.posts];
      emit();
      Store.toast('Draft created', `"${newPost.title}" is in the review queue`, 'ok');
      return newPost;
    },
    regeneratePost(postId) {
      const p = state.posts.find(x => x.id === postId);
      if (!p) return;
      Store.toast('Regenerating', 'Agents are drafting a new version…', 'info');
      setTimeout(() => {
        p.generated = 'just now';
        p.score = Math.min(100, p.score + Math.floor(Math.random() * 5) + 2);
        emit();
        Store.toast('Regeneration complete', `New score: ${p.score}`, 'ok');
      }, 2500);
    },

    // Settings
    setSetting(key, val) {
      state.settings[key] = val;
      emit();
      Store.toast('Setting updated', key, 'ok');
    },

    // Influencers
    toggleInfluencer(id) {
      state.selectedInfluencers = state.selectedInfluencers.includes(id)
        ? state.selectedInfluencers.filter(x => x !== id)
        : [...state.selectedInfluencers, id];
      emit();
    },

    // Filters
    toggleFilter(group, val) {
      const cur = state.activeFilters[group] || [];
      state.activeFilters[group] = cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val];
      emit();
    },

    // Notifications
    markNotifRead(nid) {
      const n = state.notifications.find(x => x.id === nid);
      if (n) { n.unread = false; emit(); }
    },
    markAllRead() {
      state.notifications.forEach(n => n.unread = false);
      emit();
    },

    // Competitors
    addCompetitor(name, handle) {
      state.trackedCompetitors.push({
        id: 'c_' + (++id), name, handle,
        followers: Math.floor(Math.random() * 30000) + 5000,
        posts_7d: Math.floor(Math.random() * 15) + 3,
        engagement: +(Math.random() * 3 + 1.5).toFixed(1),
        trend: '+' + Math.floor(Math.random() * 20) + '%',
        top_topic: 'Just added',
        flag: 'flat',
      });
      emit();
      Store.toast('Competitor tracked', name, 'ok');
    },
  };

  window.Store = Store;

  // React hook
  window.useStore = function () {
    const [, tick] = React.useReducer(x => x + 1, 0);
    React.useEffect(() => Store.subscribe(tick), []);
    return state;
  };
})();

function TopBar({ route, onNavigate, onToggleFeed, feedOn }) {
  const state = useStore();

  const [searchOpen, setSearchOpen] = React.useState(false);
  const [accountOpen, setAccountOpen] = React.useState(false);
  const searchRef = React.useRef(null);
  const accountRef = React.useRef(null);

  // Close on outside click
  React.useEffect(() => {
    const onDoc = (e) => {
      if (searchRef.current && !searchRef.current.contains(e.target)) setSearchOpen(false);
      if (accountRef.current && !accountRef.current.contains(e.target)) setAccountOpen(false);
    };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const results = React.useMemo(() => {
    const q = searchQ.trim().toLowerCase();
    if (!q) return SEARCH_INDEX.slice(0, 8);
    return SEARCH_INDEX.filter(r => r.label.toLowerCase().includes(q) || r.meta.toLowerCase().includes(q)).slice(0, 12);
  }, [searchQ]);

  const grouped = React.useMemo(() => {
    const g = {};
    for (const r of results) { (g[r.kind] = g[r.kind] || []).push(r); }
    return g;
  }, [results]);

  const labelFor = (k) => ({ page: 'Pages', action: 'Actions', person: 'People', post: 'Posts', trend: 'Trends' }[k] || k);

  const goto = (r) => {
    setSearchOpen(false); setSearchQ('');
    if (r.kind === 'action') {
      if (r.id === 'generate') Store.openModal({ type: 'generate' });
      else if (r.id === 'upload') Store.openModal({ type: 'upload' });
      else if (r.id === 'invite') Store.openModal({ type: 'invite' });
      else if (r.id === 'compose-email') Store.openModal({ type: 'compose-email', manual: true });
      return;
    }
    onNavigate(r.target || r.id);
  };

  const unread = (state.notifications || []).filter(n => n.unread).length;

  return (
    <div className="topbar">
      <div className="logo" style={{ cursor: 'pointer' }} onClick={() => onNavigate('dashboard')}>

          value={searchQ}
          onChange={(e) => { setSearchQ(e.target.value); setSearchOpen(true); }}
          onFocus={() => setSearchOpen(true)}
          onKeyDown={(e) => {
            if (e.key === 'Escape') { setSearchOpen(false); e.target.blur(); }
            if (e.key === 'Enter' && results[0]) { goto(results[0]); e.target.blur(); }
            if (e.key === 'k' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); Store.toggleCommand(true); setSearchOpen(false); }
          }}
        />
        <span className="s-kbd">⌘K</span>

        {searchOpen && (

            )}
            {Object.keys(grouped).map(k => (
              <div key={k}>

                {grouped[k].map(r => {

function Sparkline({ data, color = 'var(--accent)', height = 34, width = 80, filled = true }) {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const step = width / (data.length - 1);
  const points = data.map((v, i) => `${i * step},${height - ((v - min) / range) * (height - 4) - 2}`).join(' ');
  const areaPoints = `0,${height} ${points} ${width},${height}`;
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      {filled && <polygon points={areaPoints} fill={color} opacity="0.12" />}
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function LineChart({ series, height = 200, showGrid = true }) {
  const width = 560;
  const padding = { top: 12, right: 12, bottom: 22, left: 34 };
  const w = width - padding.left - padding.right;
  const h = height - padding.top - padding.bottom;
  const all = series.flatMap(s => s.data);
  const max = Math.max(...all) * 1.1;
  const min = 0;
  const range = max - min || 1;
  const len = series[0].data.length;
  const step = w / (len - 1);

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none">
      {showGrid && [0, 0.25, 0.5, 0.75, 1].map((t, i) => {
        const y = padding.top + h * t;
        const label = Math.round(max - max * t);
        return (
          <g key={i}>
            <line x1={padding.left} x2={width - padding.right} y1={y} y2={y} stroke="var(--line-1)" strokeDasharray={i === 4 ? '' : '2 4'} />
            <text x={padding.left - 6} y={y + 3} textAnchor="end" fontSize="10" fill="var(--text-3)" fontFamily="var(--font-mono)">{label}</text>
          </g>
        );
      })}
      {['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => (
        <text key={i} x={padding.left + step * i} y={height - 6} textAnchor="middle" fontSize="10" fill="var(--text-3)" fontFamily="var(--font-mono)">{d}</text>
      ))}
      {series.map((s, si) => {
        const pts = s.data.map((v, i) => `${padding.left + i * step},${padding.top + h - ((v - min) / range) * h}`).join(' ');
        const area = `${padding.left},${padding.top + h} ${pts} ${padding.left + w},${padding.top + h}`;
        return (
          <g key={si}>
            {s.fill && <polygon points={area} fill={s.color} opacity="0.1" />}
            <polyline points={pts} fill="none" stroke={s.color} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" />
            {s.data.map((v, i) => (
              <circle key={i} cx={padding.left + i * step} cy={padding.top + h - ((v - min) / range) * h} r="2.5" fill="var(--bg-0)" stroke={s.color} strokeWidth="1.5" />
            ))}
          </g>
        );
      })}
    </svg>
  );
}

function StatusBadge({ status }) {
  if (status === 'pending_review') return <span className="badge warn dot">Pending</span>;
  if (status === 'approved') return <span className="badge ok dot">Approved</span>;
  if (status === 'rejected') return <span className="badge err dot">Rejected</span>;
  if (status === 'generating') return <span className="badge accent dot">Generating</span>;
  return <span className="badge">{status}</span>;
}

function ApprovalWorkflow({ variant = 'sidebyside', onVariantChange }) {
  const state = useStore();
  const pending = state.posts.filter(p => p.status === 'pending_review' || p.status === 'rejected');
  const [currentIdx, setCurrentIdx] = React.useState(0);
  const post = pending[currentIdx] || pending[0] || state.posts[0];

  React.useEffect(() => {
    if (currentIdx >= pending.length && pending.length > 0) setCurrentIdx(pending.length - 1);
  }, [pending.length]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'a' || e.key === 'A') { e.preventDefault(); if (post) Store.openModal({ type: 'schedule', postId: post.id }); }
      if (e.key === 'r' || e.key === 'R') { e.preventDefault(); if (post) Store.openModal({ type: 'reject-reason', postId: post.id }); }
      if (e.key === 'e' || e.key === 'E') { e.preventDefault(); if (post) Store.openModal({ type: 'revise-note', postId: post.id }); }
      if (e.key === 'ArrowRight') setCurrentIdx(i => Math.min(pending.length - 1, i + 1));
      if (e.key === 'ArrowLeft') setCurrentIdx(i => Math.max(0, i - 1));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [post, pending.length]);

  if (!post) {
    return (
      <div className="page">
        <div className="page-h">
          <div>
            <div className="eyebrow">Approval Queue</div>
            <h1>All clear</h1>
            <p>Nothing waiting for review. Agents are still generating in the background.</p>

          <button className="btn primary" onClick={() => Store.openModal({ type: 'generate' })}><I.Sparkles size={12} /> Generate a draft</button>
        </div>
      </div>
    );
  }

  const Pc = Platforms[post.platform];

          <div className="eyebrow">Approval Queue · {currentIdx + 1} of {pending.length}</div>

          <div className="row" style={{ gap: 4 }}>
            <button className="btn icon-only" onClick={() => setCurrentIdx(Math.max(0, currentIdx - 1))}><I.ChevronLeft size={13} /></button>
            <button className="btn icon-only" onClick={() => setCurrentIdx(Math.min(pending.length - 1, currentIdx + 1))}><I.ChevronRight size={13} /></button>
          </div>
          <div className="segmented">
            {['sidebyside', 'stack', 'mobile'].map(v => (
              <button key={v} className={variant === v ? 'active' : ''} onClick={() => onVariantChange && onVariantChange(v)}>{v === 'sidebyside' ? 'Side-by-side' : v === 'stack' ? 'Stack' : 'Mobile'}</button>
            ))}
          </div>
        </div>
      </div>

      <div style={{
        display: variant === 'mobile' ? 'flex' : 'grid',
        flexDirection: variant === 'mobile' ? 'column' : undefined,
        alignItems: variant === 'mobile' ? 'stretch' : undefined,
        gridTemplateColumns: variant === 'sidebyside' ? '1.4fr 1fr' : variant === 'stack' ? '1fr' : undefined,
        maxWidth: variant === 'mobile' ? 460 : undefined,

function Influencers() {
  const state = useStore();
  const selected = state.selectedInfluencers;

  const [search, setSearch] = React.useState('');
  const [sort, setSort] = React.useState('alignment');
  const [minFollowers, setMinFollowers] = React.useState(10000);
  const [minAuth, setMinAuth] = React.useState(90);
  const [nicheFilters, setNicheFilters] = React.useState(new Set(['faang', 'ml', 'tech', 'ai', 'phd', 'eb1a']));
  const [platformFilters, setPlatformFilters] = React.useState(new Set(['linkedin', 'instagram', 'x']));
  const [locFilters, setLocFilters] = React.useState(new Set(['us']));

  // Map filter id -> exact niche string used in INFLUENCERS data
  const nicheMap = {
    faang: 'FAANG engineers',
    ml: 'ML engineers',
    eb1a: 'EB1A/O-1A creators',
    tech: 'Tech immigration',
    ai: 'AI research + visas',
    founder: 'Startup founder visa',
    phd: 'PhD pathway',
    pm: 'PM / leadership',
    edu: 'Immigration education',
    design: 'Designer IC',
    gc: 'Green card journey',
  };

  let list = INFLUENCERS.filter(i => i.followers >= minFollowers && i.authenticity >= minAuth);
  if (nicheFilters.size > 0) {
    const allowed = new Set([...nicheFilters].map(id => nicheMap[id]).filter(Boolean));
    list = list.filter(i => allowed.has(i.niche));
  }
  if (platformFilters.size > 0) list = list.filter(i => platformFilters.has(i.platform));
  if (locFilters.size > 0) list = list.filter(i => locFilters.has(i.country));
  if (search) list = list.filter(i => i.name.toLowerCase().includes(search.toLowerCase()) || i.handle.toLowerCase().includes(search.toLowerCase()) || i.niche.toLowerCase().includes(search.toLowerCase()) || i.location.toLowerCase().includes(search.toLowerCase()));

  if (sort === 'engagement') list = [...list].sort((a, b) => b.engagement - a.engagement);

  const togSet = (setter, set, id) => {
    const s = new Set(set);
    if (s.has(id)) s.delete(id); else s.add(id);
    setter(s);

    setMinFollowers(1000); setMinAuth(0);

              <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600 }}>Niche</div>

                  { id: 'eb1a', label: 'EB1A / O-1A creators', count: 94, badge: 'adjacent' },

                  { id: 'ai', label: 'AI research + visas', count: 318 },
                  { id: 'founder', label: 'Startup founders', count: 289 },
                  { id: 'phd', label: 'PhD pathway', count: 196 },
                  { id: 'pm', label: 'PM / leadership', count: 412 },
                  { id: 'edu', label: 'Immigration education', count: 168 },

                  { id: 'design', label: 'Designer IC', count: 86 },

                      <button className={'btn icon-only ' + (isSelected ? 'primary' : '')} onClick={(e) => { e.stopPropagation(); toggle(inf.id); }} title={isSelected ? 'Remove from shortlist' : 'Add to shortlist'}>
                        {isSelected ? <I.Check size={12} /> : <I.Plus size={12} />}
                      </button>
                    </div>
                    <div style={{ fontSize: 11.5, color: 'var(--text-2)', marginBottom: 10 }}>
                      <span className="badge" style={{ marginRight: 4 }}><I.MapPin size={9} /> {inf.location}</span>
                      <span className="badge accent">{inf.niche}</span>
                    </div>
                    <div className="grid-3" style={{ gap: 8 }}>
                      <Metric label="Followers" value={(inf.followers / 1000).toFixed(0) + 'K'} />
                      <Metric label="Engage" value={inf.engagement + '%'} accent />
                      <Metric label="Rate" value={inf.rate} />
                    </div>
                    <div style={{ marginTop: 12, paddingTop: 12, borderTop: '1px solid var(--line-1)' }}>
                      <ScoreBar label="Authenticity" value={inf.authenticity} />
                      <ScoreBar label="Brand alignment" value={inf.alignment} />
                    </div>
                  </div>
                </div>
              );
            })}
            {!list.length && <div style={{ padding: 40, textAlign: 'center', color: 'var(--text-3)', fontSize: 13, gridColumn: '1/-1', border: '1px dashed var(--line-2)', borderRadius: 8 }}>No matches — try loosening filters.</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

function FilterGroup({ label, options }) {
  return (
    <div>
      <div style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600 }}>{label}</div>
      <div className="col" style={{ gap: 4 }}>
        {options.map(o => (
          <label key={o.id} className="row" style={{ gap: 8, fontSize: 12, cursor: 'default', padding: '2px 0' }}>
            <input type="checkbox" defaultChecked={o.active} style={{ accentColor: 'var(--accent)' }} />
            <span style={{ color: o.active ? 'var(--text-0)' : 'var(--text-2)' }}>{o.label}</span>
            <span style={{ marginLeft: 'auto', color: 'var(--text-4)', fontSize: 11 }} className="mono">{o.count}</span>
          </label>
        ))}
      </div>
    </div>
  );
}

function Metric({ label, value, accent }) {
  return (
    <div>
      <div style={{ fontSize: 10, color: 'var(--text-3)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600 }}>{label}</div>
      <div className="num" style={{ fontSize: 14, fontWeight: 600, color: accent ? 'var(--teal-1)' : 'var(--text-0)', marginTop: 2 }}>{value}</div>
    </div>
  );
}

function ScoreBar({ label, value }) {
  return (
    <div style={{ marginBottom: 6 }}>
      <div className="row" style={{ justifyContent: 'space-between', fontSize: 11, marginBottom: 3 }}>
        <span style={{ color: 'var(--text-2)' }}>{label}</span>
        <span className="num" style={{ color: 'var(--text-0)', fontWeight: 500 }}>{value}</span>
      </div>
      <div className="progress" style={{ height: 3 }}><div style={{ width: `${value}%`, background: value > 90 ? 'var(--teal)' : 'var(--accent)' }}></div></div>
    </div>
  );
}

  const [sent, setSent] = React.useState(() => SENT_EMAILS.map(s => ({ ...s })));

  const toggle = (id) => {
    const next = reports.map(r => r.id === id ? { ...r, enabled: !r.enabled } : r);
    setReports(next);
    const r = next.find(x => x.id === id);
    Store.toast(r.enabled ? 'Report enabled' : 'Report paused', r.name, r.enabled ? 'ok' : 'warn');

  const sendNow = (id) => {
    const r = reports.find(x => x.id === id);
    if (!r) return;
    Store.toast('Sending…', `"${r.name}" being dispatched to ${r.recipients.length} recipient${r.recipients.length > 1 ? 's' : ''}`, 'info');
    setTimeout(() => {
      const newEmail = {
        id: 'e_' + Date.now(),

        type: r.kind,
        to: r.recipients.length === 1 ? r.recipients[0] : `${r.recipients.length} recipients`,
        sent: 'Just now',
        opened: false,
        clicked: 0,
        preview: r.desc,
      };
      setSent([newEmail, ...sent]);

  const list = React.useMemo(() => {

    if (sort === 'unread') l = [...l].sort((a, b) => b.unread - a.unread);
    return l;

    positive: s.positive + p.sentiment.positive,
    neutral: s.neutral + p.sentiment.neutral,
    negative: s.negative + p.sentiment.negative,
  }), { positive: 0, neutral: 0, negative: 0 });
  const sentTotal = aggSentiment.positive + aggSentiment.neutral + aggSentiment.negative;
  const posPct = Math.round((aggSentiment.positive / sentTotal) * 100);
  const negPct = Math.round((aggSentiment.negative / sentTotal) * 100);
  const neuPct = 100 - posPct - negPct;

          <div className="lbl">Mentions</div>
          <div className="val">42</div>

// Modals, Toasts, Command Palette overlay
// Mounted once at App root level.

function Modal({ children, onClose, width = 520, title, subtitle }) {
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{ width }} onClick={(e) => e.stopPropagation()}>
        {(title || subtitle) && (
          <div className="modal-header">
            <div>
              {title && <div className="modal-title">{title}</div>}
              {subtitle && <div className="modal-sub">{subtitle}</div>}
            </div>
            <button className="btn ghost icon-only" onClick={onClose}><I.X size={14} /></button>
          </div>
        )}
        {children}
      </div>
    </div>
  );
}

// ---------- Toasts ----------
function Toasts() {
  const state = useStore();
  return (
    <div className="toast-stack">
      {state.toasts.map(t => (
        <div key={t.id} className={'toast ' + (t.kind || 'info')}>
          <div className="toast-ic">
            {t.kind === 'ok' && <I.Check size={12} />}
            {t.kind === 'warn' && <I.AlertTriangle size={12} />}
            {t.kind === 'info' && <I.Info size={12} />}
          </div>
          <div>
            <div className="toast-title">{t.title}</div>
            {t.body && <div className="toast-body">{t.body}</div>}
          </div>
        </div>
      ))}
    </div>
  );
}

      <div className="modal cmdk" onClick={(e) => e.stopPropagation()} style={{ width: 560, padding: 0 }}>
        <div className="cmdk-input">
          <I.Search size={14} style={{ color: 'var(--text-3)' }} />
          <input
            ref={inputRef}
            value={q}
            onChange={e => setQ(e.target.value)}
            placeholder="Type a command or search…"
          />
          <span className="kbd">Esc</span>
        </div>
        <div className="cmdk-list">
          {Object.entries(grouped).map(([group, items]) => (
            <div key={group}>
              <div className="cmdk-group">{group}</div>
              {items.map(c => {
                const Ic = I[c.icon] || I.ChevronRight;
                return (
                  <div key={c.id} className="cmdk-item" onClick={() => { c.run(); Store.toggleCommand(false); setQ(''); }}>
                    <Ic size={14} style={{ color: 'var(--text-2)' }} />
                    <span>{c.label}</span>
                    {c.kbd && <span className="kbd" style={{ marginLeft: 'auto' }}>{c.kbd}</span>}
                  </div>
                );
              })}
            </div>
          ))}
          {!filtered.length && <div style={{ padding: 20, textAlign: 'center', color: 'var(--text-3)', fontSize: 12 }}>No results</div>}
        </div>
      </div>
    </div>
  );
}

function ModalRoot({ onNavigate }) {
  const state = useStore();
  const m = state.modal;
  if (!m) return null;

  if (m.type === 'generate') return <GenerateWizard onClose={Store.closeModal} onDone={(post) => { Store.closeModal(); onNavigate('approval'); Store.toggleCommand(false); }} prefill={m.prefill} />;
  if (m.type === 'upload') return <UploadDocsModal onClose={Store.closeModal} />;
  if (m.type === 'add-competitor') return <AddCompetitorModal onClose={Store.closeModal} />;
  if (m.type === 'invite') return <InviteModal onClose={Store.closeModal} />;
  if (m.type === 'reject-reason') return <RejectModal postId={m.postId} onClose={Store.closeModal} />;
  if (m.type === 'revise-note') return <ReviseModal postId={m.postId} onClose={Store.closeModal} />;
  if (m.type === 'schedule') return <ScheduleModal postId={m.postId} onClose={Store.closeModal} />;
  if (m.type === 'persona-edit') return <PersonaEditModal persona={m.persona} onClose={Store.closeModal} />;
  if (m.type === 'doc-preview') return <DocPreviewModal doc={m.doc} onClose={Store.closeModal} />;
  if (m.type === 'influencer-outreach') return <OutreachModal influencer={m.influencer} onClose={Store.closeModal} />;
  if (m.type === 'shortlist-export') return <ShortlistExportModal onClose={Store.closeModal} />;
  if (m.type === 'new-event') return <NewEventModal onClose={Store.closeModal} date={m.date} />;
  if (m.type === 'event-detail') return <EventDetailModal onClose={Store.closeModal} post={m.post} onOpen={() => { Store.closeModal(); onNavigate('approval'); }} />;
  if (m.type === 'notifications') return <NotificationsPanel onClose={Store.closeModal} onNavigate={onNavigate} />;
  if (m.type === 'account-connect') return <AccountConnectModal onClose={Store.closeModal} account={m.account} />;
  if (m.type === 'compose-email') return <ComposeEmailModal onClose={Store.closeModal} manual={m.manual} template={m.template} />;
  if (m.type === 'preview-email') return <PreviewEmailModal onClose={Store.closeModal} email={m.email} report={m.report} />;
  if (m.type === 'edit-report') return <EditReportModal onClose={Store.closeModal} report={m.report} />;

  if (m.type === 'integration-detail') return <IntegrationDetailModal onClose={Store.closeModal} integration={m.integration} />;
  return null;
}

function GenerateWizard({ onClose, onDone, prefill }) {
  const [step, setStep] = React.useState(1);
  const [config, setConfig] = React.useState({
    platform: prefill?.platform || 'linkedin',
    type: prefill?.type || 'single',
    persona: prefill?.persona || 'Senior tech IC considering self-petition',
    trend: prefill?.trend || null,
    tone: 'authoritative',
    goal: 'lead-gen',
  });
  const [generating, setGenerating] = React.useState(false);
  const [agentSteps, setAgentSteps] = React.useState([]);

  const startGen = () => {
    setStep(3);
    setGenerating(true);
    const stepsList = [
      { label: 'Research agent scanning trend context', duration: 700 },
      { label: 'Copy agent drafting hook variants', duration: 900 },
      { label: 'Compliance agent validating claims', duration: 600 },
      { label: 'Creative agent rendering visuals', duration: 800 },
      { label: 'Review agent scoring engagement', duration: 500 },
    ];
    let acc = 0;
    stepsList.forEach((s, i) => {
      setTimeout(() => setAgentSteps(prev => [...prev, { ...s, i, done: false }]), acc);
      acc += s.duration;
      setTimeout(() => setAgentSteps(prev => prev.map(p => p.i === i ? { ...p, done: true } : p)), acc);
    });
    setTimeout(() => {
      const title = config.trend
        ? `Hot take: ${config.trend} — what it means for EB-1A candidates`
        : 'The signal most petitions miss (and how to surface it)';
      const post = Store.createPost({
        platform: config.platform,
        type: config.type,
        persona: config.persona,
        trend: config.trend,
        title,
        body: 'Every approved EB-1A we\'ve worked on has one non-obvious common thread: evidence that forces the officer to say yes. Here\'s how we surface it.\n\nThe trick isn\'t adding more evidence — it\'s removing ambiguity. Three moves we run on every petition →',
        hashtags: ['#EB1A', '#GreenCard', '#ExtraordinaryAbility', '#USCIS'],
        cta: 'Book a free 20-min eligibility call',
      });
      setGenerating(false);
      setTimeout(() => onDone(post), 400);
    }, acc + 200);
  };

  return (
    <Modal onClose={onClose} width={560} title={step === 3 ? 'Generating your post' : 'New post'} subtitle={step === 3 ? 'Agents are working' : `Step ${step} of 2`}>
      {step === 1 && (
        <div className="modal-body">
          <div className="field-group">
            <label>Platform</label>
            <div className="pill-row">
              {['linkedin', 'instagram', 'x', 'facebook'].map(p => (
                <button key={p} className={'pill' + (config.platform === p ? ' active' : '')} onClick={() => setConfig({ ...config, platform: p })}>
                  <I.Globe size={11} /> {p}
                </button>
              ))}
            </div>
          </div>
          <div className="field-group">
            <label>Format</label>
            <div className="pill-row">
              {['single', 'carousel', 'reel', 'thread', 'story'].map(t => (
                <button key={t} className={'pill' + (config.type === t ? ' active' : '')} onClick={() => setConfig({ ...config, type: t })}>{t}</button>
              ))}
            </div>
          </div>
          <div className="field-group">
            <label>Audience persona</label>
            <select value={config.persona} onChange={e => setConfig({ ...config, persona: e.target.value })}>
              <option>Senior tech IC considering self-petition</option>
              <option>Mid-career PM, 7-10y, US-based</option>
              <option>Researcher/PhD audience</option>
              <option>O-1 holders considering upgrade</option>
              <option>Startup founder on E-2 looking to upgrade</option>
            </select>
          </div>
          <div className="field-group">
            <label>Anchor on a trend (optional)</label>
            <select value={config.trend || ''} onChange={e => setConfig({ ...config, trend: e.target.value || null })}>
              <option value="">— No trend anchor —</option>
              {window.TRENDS.map(t => <option key={t.id}>{t.topic}</option>)}
            </select>
          </div>
          <div className="modal-footer">
            <button className="btn ghost" onClick={onClose}>Cancel</button>
            <button className="btn primary" onClick={() => setStep(2)}>Continue <I.ArrowRight size={12} /></button>
          </div>
        </div>
      )}

      {step === 2 && (
        <div className="modal-body">
          <div className="field-group">
            <label>Tone</label>
            <div className="pill-row">
              {['authoritative', 'empathetic', 'contrarian', 'educational', 'story-driven'].map(t => (
                <button key={t} className={'pill' + (config.tone === t ? ' active' : '')} onClick={() => setConfig({ ...config, tone: t })}>{t}</button>
              ))}
            </div>
          </div>
          <div className="field-group">
            <label>Primary goal</label>
            <div className="pill-row">
              {[{ v: 'lead-gen', l: 'Lead gen' }, { v: 'authority', l: 'Thought leadership' }, { v: 'awareness', l: 'Awareness' }, { v: 'engagement', l: 'Engagement' }].map(o => (
                <button key={o.v} className={'pill' + (config.goal === o.v ? ' active' : '')} onClick={() => setConfig({ ...config, goal: o.v })}>{o.l}</button>
              ))}
            </div>
          </div>
          <div className="hint-card">
            <div className="row" style={{ gap: 6, marginBottom: 6 }}>
              <I.Sparkles size={12} style={{ color: 'var(--accent-1)' }} />
              <span style={{ fontWeight: 600, fontSize: 12 }}>What happens next</span>
            </div>
            <div style={{ fontSize: 11.5, color: 'var(--text-2)', lineHeight: 1.55 }}>
              5 agents will run in sequence: research → copy → compliance → creative → review. The draft lands in <b>Review & Approve</b> with a quality score and 6-layer compliance trace.
            </div>
          </div>
          <div className="modal-footer">
            <button className="btn ghost" onClick={() => setStep(1)}><I.ArrowLeft size={12} /> Back</button>
            <button className="btn primary" onClick={startGen}><I.Sparkles size={12} /> Generate</button>
          </div>
        </div>
      )}

      {step === 3 && (
        <div className="modal-body">
          <div className="agent-steps">
            {agentSteps.map((s, i) => (
              <div key={i} className={'agent-step' + (s.done ? ' done' : ' running')}>
                <div className="step-ic">
                  {s.done ? <I.Check size={12} /> : <div className="dot"></div>}
                </div>
                <span>{s.label}</span>
              </div>
            ))}
          </div>
          {!generating && (
            <div className="row" style={{ gap: 8, marginTop: 12, justifyContent: 'center' }}>
              <div className="badge" style={{ background: 'rgba(34,197,94,0.15)', color: '#4ade80', border: '1px solid rgba(34,197,94,0.3)' }}>
                <I.Check size={11} /> Draft ready — opening review…
              </div>
            </div>
          )}
        </div>
      )}
    </Modal>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = React.useState('dashboard');
  const [feedOn, setFeedOn] = React.useState(t.feedOn);
  const [navCollapsed, setNavCollapsed] = React.useState(false);
  const [autoFeed, setAutoFeed] = React.useState(true);

  React.useEffect(() => {
    const check = () => {
      const w = window.innerWidth;
      setNavCollapsed(w < 1100);
      if (autoFeed) setFeedOn(w >= 1280);
    };
    check();
    window.addEventListener('resize', check);
    return () => window.removeEventListener('resize', check);
  }, [autoFeed]);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', t.theme);
    document.documentElement.setAttribute('data-density', t.density);
    const a = ACCENTS[t.accent] || ACCENTS.violet;
    document.documentElement.style.setProperty('--accent', a.c);
    document.documentElement.style.setProperty('--accent-1', a.c1);
    document.documentElement.style.setProperty('--accent-bg', a.bg);
    document.documentElement.style.setProperty('--accent-ring', a.ring);
    document.documentElement.style.setProperty('--font-sans', FONTS[t.font]);
    document.body.style.fontFamily = FONTS[t.font];
  }, [t.theme, t.density, t.accent, t.font]);

  React.useEffect(() => { Store.init(); }, []);

  React.useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key === 'k') { e.preventDefault(); Store.toggleCommand(); return; }
      if (e.key === 'Escape') { Store.toggleCommand(false); Store.closeModal(); return; }
      if (mod && e.key === '1') { e.preventDefault(); setRoute('dashboard'); }
      if (mod && e.key === '2') { e.preventDefault(); setRoute('queue'); }
      if (mod && e.key === '3') { e.preventDefault(); setRoute('approval'); }
      if (mod && e.key === '4') { e.preventDefault(); setRoute('calendar'); }
      if (mod && e.key === '5') { e.preventDefault(); setRoute('engagement'); }
      if (mod && e.key === '6') { e.preventDefault(); setRoute('analytics'); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  let screen = null;
  if (route === 'dashboard') screen = <Dashboard onNavigate={setRoute} />;
  else if (route === 'queue') screen = <ContentQueue onOpenPost={() => setRoute('approval')} onNavigate={setRoute} />;
  else if (route === 'approval') screen = <ApprovalWorkflow variant={t.approvalVariant} onVariantChange={(v) => setTweak('approvalVariant', v)} />;
  else if (route === 'calendar') screen = <Calendar />;
  else if (route === 'engagement') screen = <EngagementHub />;
  else if (route === 'analytics') screen = <Analytics onNavigate={setRoute} />;
  else if (route === 'trends') screen = <Trends />;
  else if (route === 'influencers') screen = <Influencers />;
  else if (route === 'daily') screen = <DailyBrief onNavigate={setRoute} />;
  else if (route === 'reports') screen = <Reports onNavigate={setRoute} />;
  else if (route === 'onboarding') screen = <Onboarding />;
  else if (route === 'integrations') screen = <SEOIntegrations onNavigate={setRoute} />;
  else if (route === 'settings') screen = <Settings />;

  return (
    <div className="app" data-feed={feedOn ? 'on' : 'off'} data-nav={navCollapsed ? 'collapsed' : 'expanded'}>
      <TopBar route={route} onNavigate={setRoute} feedOn={feedOn} onToggleFeed={() => { setAutoFeed(false); setFeedOn(!feedOn); }} />
      <SideNav route={route} onNavigate={setRoute} collapsed={navCollapsed} />
      <div className="main" data-screen-label={route}>{screen}</div>
      {feedOn && <ActivityFeed />}
      <Toasts />
      <CommandPalette onNavigate={setRoute} />
      <ModalRoot onNavigate={setRoute} />

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={t.theme} options={['dark', 'light']} onChange={(v) => setTweak('theme', v)} />
        <TweakRadio label="Accent" value={t.accent} options={['violet', 'teal', 'lime', 'cyan', 'magenta', 'amber']} onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Typography & Density" />
        <TweakSelect label="Font" value={t.font} options={[
          { value: 'inter-tight', label: 'Inter Tight (default)' },
          { value: 'inter', label: 'Inter' },
          { value: 'mono', label: 'JetBrains Mono' },
          { value: 'serif', label: 'Instrument Serif' },
        ]} onChange={(v) => setTweak('font', v)} />
        <TweakRadio label="Density" value={t.density} options={['compact', 'regular', 'comfy']} onChange={(v) => setTweak('density', v)} />

        <TweakSection label="Layout" />
        <TweakToggle label="Activity feed" value={feedOn} onChange={(v) => { setFeedOn(v); setTweak('feedOn', v); }} />
        <TweakRadio label="Approval view" value={t.approvalVariant} options={['sidebyside', 'stack', 'mobile']} onChange={(v) => setTweak('approvalVariant', v)} />

        <TweakSection label="Quick navigate" />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
          {[
            { id: 'dashboard', l: 'Command' },
            { id: 'queue', l: 'Queue' },
            { id: 'approval', l: 'Approval' },
            { id: 'calendar', l: 'Calendar' },
            { id: 'analytics', l: 'Analytics' },
            { id: 'trends', l: 'Trends' },
            { id: 'influencers', l: 'Influencers' },
            { id: 'daily', l: 'Daily Brief' },
            { id: 'onboarding', l: 'Knowledge' },
            { id: 'settings', l: 'Settings' },
          ].map(r => (
            <button key={r.id}
              onClick={() => setRoute(r.id)}
              className="twk-field"
              style={{
                cursor: 'default', textAlign: 'left', fontSize: 11,
                background: route === r.id ? 'rgba(124,92,255,0.15)' : '',
                borderColor: route === r.id ? 'rgba(124,92,255,0.4)' : '',
                color: route === r.id ? '#7c5cff' : '',
                fontWeight: route === r.id ? 600 : 400,
              }}>
              {r.l}
            </button>
          ))}
        </div>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
